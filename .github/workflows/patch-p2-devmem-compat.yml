name: Apply P2 devmem compatibility patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-p2-devmem-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/patch_p2_devmem_compat.py

      - name: Validate
        run: |
          git diff --check
          grep -q 'static bool p2_physical_ddr_mapping_active' ggml/src/ggml-cpu/fpga_host.cpp
          grep -q 'FPGA_P2_DEVMEM_COMPAT' ggml/src/ggml-cpu/fpga_host.cpp
          ! grep -q 'g_allow_devmem_fallback   = false;' ggml/src/ggml-cpu/fpga_host.cpp

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ggml/src/ggml-cpu/fpga_host.cpp
          git commit -m 'fpga: allow bounded P2 devmem compatibility'
          git push origin HEAD:main
